server:
  listen_address: "0.0.0.0"
  sip_port_udp: 5060
  sip_port_tcp: 5060
  sip_port_tls: 5061
  tls_cert: "/etc/ssl/certs/siprec-srs.pem"
  tls_key: "/etc/ssl/private/siprec-srs.key"
  user_agent: "SIPREC-SRS/1.0"
  max_sessions: 100
  session_timeout: 3600  # 1 hour

storage:
  local_path: "./vcons"
  filename_pattern: "{timestamp}_{call_id}.vcon.json"
  create_directories: true
  cleanup_temp_files: true

webhooks:
  enabled: true
  # When all endpoints fail for a vCon, the JSON + a sidecar metadata file
  # are written to this directory for later replay. Set to null to disable.
  dlq_path: "./dlq"
  endpoints:
    - url: "https://api.example.com/vcons"
      headers:
        Authorization: "Bearer your-token-here"
      retry_attempts: 3
      timeout: 30
      backoff_factor: 2.0
      # When set, request bodies are HMAC-SHA256-signed and the digest is
      # sent as `X-Hub-Signature-256: sha256=<hex>`. Leave null to skip.
      hmac_secret: null

media:
  # "inline" embeds audio as base64url in the Dialog body (default,
  # self-contained but large). "external" emits url + content_hash and
  # expects audio to be published separately under base_url.
  mode: "inline"
  base_url: null  # e.g. "https://media.example.com/recordings"

signing:
  # When enabled, vCons are JWS-signed in place after extension attachments
  # are added and before storage / webhook delivery. RS256 only.
  enabled: false
  private_key_path: null  # e.g. "/etc/ssl/private/vcon-signing.pem"
  private_key_password: null

health:
  enabled: true
  host: "0.0.0.0"
  port: 8080

rtp:
  buffer_size: 65536
  supported_codecs:
    - "PCMU/8000"  # G.711 μ-law
    - "PCMA/8000"  # G.711 A-law
    - "G722/8000"  # G.722
    - "opus/48000" # Opus
  audio_format: "wav"
  sample_rate: 8000
  channels: 1

lawful_basis:
  enabled: true
  lawful_basis: "legitimate_interests"  # consent | contract | legal_obligation | vital_interests | public_task | legitimate_interests
  purposes:
    - "recording"
    - "transcription"
    - "analysis"
  expiration: null  # ISO 8601 or null for indefinite
  justification: "SIPREC recording captured by network infrastructure; Data Controller manages data-subject consent separately."

logging:
  level: "INFO"
  file: "./logs/siprec-srs.log"
  max_size: "10MB"
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
