version: '3.8'

services:
  siprec-srs:
    build: .
    container_name: siprec-srs
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
    volumes:
      - ./vcons:/app/vcons
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - SIPREC_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 5060)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a webhook test server
  webhook-test:
    image: nginx:alpine
    container_name: webhook-test
    ports:
      - "8080:80"
    volumes:
      - ./webhook-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - siprec-srs
