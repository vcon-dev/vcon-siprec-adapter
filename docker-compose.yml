version: '3.8'

services:
  siprec-srs:
    build: .
    container_name: siprec-srs
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      # Health + Prometheus metrics (health.port in config.yaml).
      - "8080:8080/tcp"
      # RTP media. Must cover rtp.port_range_start..rtp.port_range_end.
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./vcons:/app/vcons
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      # TLS cert + key referenced by server.tls_cert / server.tls_key.
      - ./certs:/app/certs:ro
      # Uncomment when media.publisher is "filesystem".
      # - ./recordings:/app/recordings
    environment:
      - SIPREC_LOG_LEVEL=INFO
      # Set when the container's bind address is not the address peers reach.
      # - SIPREC_PUBLIC_IP=YOUR.PUBLIC.IP
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a webhook test server.
  # Host 8081 avoids colliding with the adapter's health port (8080).
  webhook-test:
    image: nginx:alpine
    container_name: webhook-test
    ports:
      - "8081:80"
    volumes:
      - ./webhook-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - siprec-srs
